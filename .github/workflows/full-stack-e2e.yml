name: Full real-stack E2E

on:
  workflow_dispatch:
    inputs:
      docs_ref:
        description: foodmind-docs Git ref
        required: true
        default: main
      backend_ref:
        description: foodmind-backend Git ref
        required: true
        default: master
      web_ref:
        description: foodmind-web Git ref
        required: true
        default: master
      android_ref:
        description: foodmind-android Git ref
        required: true
        default: master
      intelligence_ref:
        description: foodmind-intelligence Git ref
        required: true
        default: main
      ml_ref:
        description: foodmind-ml Git ref
        required: true
        default: main

permissions:
  contents: read

jobs:
  web-and-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: foodmind-team/foodmind-docs
          ref: ${{ inputs.docs_ref }}
          path: foodmind-docs
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: foodmind-team/foodmind-backend
          ref: ${{ inputs.backend_ref }}
          path: foodmind-backend
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: foodmind-team/foodmind-web
          ref: ${{ inputs.web_ref }}
          path: foodmind-web
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: foodmind-team/foodmind-android
          ref: ${{ inputs.android_ref }}
          path: foodmind-android
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: foodmind-team/foodmind-intelligence
          ref: ${{ inputs.intelligence_ref }}
          path: foodmind-intelligence
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: foodmind-team/foodmind-ml
          ref: ${{ inputs.ml_ref }}
          path: foodmind-ml

      - name: Expose the Android emulator host bridge to host Chromium
        run: |
          sudo ip address add 10.0.2.2/32 dev lo || true

      - name: Build and start the unmocked stack
        working-directory: foodmind-docs/testing/full-stack
        run: |
          docker compose config
          docker compose up --build --wait --wait-timeout 600

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.16.0
          cache: npm
          cache-dependency-path: foodmind-web/package-lock.json
      - name: Run no-interception Web scenario
        working-directory: foodmind-web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e:real

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Build the CI APK
        working-directory: foodmind-android
        run: ./gradlew --no-daemon apiCheck clean testDebugUnitTest assembleDebug lintDebug compileDebugAndroidTestKotlin
      - name: Run shared-account Android emulator parity probe
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          working-directory: foodmind-android
          script: ./gradlew --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.realStack=true

      - name: Assert correlation identifier reached runtime logs
        working-directory: foodmind-docs/testing/full-stack
        run: docker compose logs --no-color | tee full-stack.log && grep -q "web-real-e2e-20260811" full-stack.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: full-stack-e2e-evidence
          if-no-files-found: ignore
          path: |
            foodmind-docs/testing/full-stack/full-stack.log
            foodmind-web/playwright-report-real/
            foodmind-web/test-results-real/
            foodmind-android/app/build/outputs/apk/debug/
            foodmind-android/app/build/reports/
            foodmind-android/app/build/outputs/androidTest-results/
      - name: Tear down test-owned resources
        if: always()
        working-directory: foodmind-docs/testing/full-stack
        run: docker compose down --volumes --remove-orphans
