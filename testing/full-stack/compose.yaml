name: foodmind-e2e

services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_DB: foodmind_e2e
      POSTGRES_USER: foodmind
      POSTGRES_PASSWORD: foodmind_e2e_password
      TZ: UTC
      PGTZ: UTC
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodmind -d foodmind_e2e"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [private]

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: foodmind_e2e_media
      MINIO_ROOT_PASSWORD: foodmind_e2e_media_password
      MINIO_API_CORS_ALLOW_ORIGIN: http://127.0.0.1:4173,http://localhost:4173
    ports:
      - "0.0.0.0:9000:9000"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 18
    networks: [private]

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://minio:9000 foodmind_e2e_media foodmind_e2e_media_password
        mc mb --ignore-existing local/foodmind-e2e-media
        mc anonymous set none local/foodmind-e2e-media
    depends_on:
      minio:
        condition: service_healthy
    networks: [private]
  model-package:
    image: python:3.13-slim
    working_dir: /ml
    command:
      - sh
      - -ec
      - pip install --no-cache-dir numpy==2.3.2 && python scripts/build_runtime_package.py --output /model-package
    volumes:
      - ../../../foodmind-ml:/ml:ro
      - model-package:/model-package
    networks: [private]

  inference:
    build: ../../../foodmind-intelligence/inference-service
    environment:
      INFERENCE_APP_ENV: local
      INFERENCE_INTERNAL_SERVICE_TOKEN: local-inference-only
      INFERENCE_MODEL_PACKAGE_DIR: /model-package
    volumes:
      - model-package:/model-package:ro
    depends_on:
      model-package:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [private]

  recommendation:
    build: ../../../foodmind-intelligence/agent-service/app/agents/recommendation
    env_file:
      - path: ../../../foodmind-intelligence/agent-service/app/agents/.env
        required: false
    environment:
      RECOMMENDATION_AGENT_APP_ENV: local
      RECOMMENDATION_AGENT_INTERNAL_SERVICE_TOKEN: local-recommendation-token
      RECOMMENDATION_AGENT_SUPPORTED_CONTRACT_VERSIONS: recommendation-agent-v2
      RECOMMENDATION_AGENT_INFERENCE_BASE_URL: http://inference:8002
      RECOMMENDATION_AGENT_INFERENCE_SERVICE_TOKEN: local-inference-only
      RECOMMENDATION_AGENT_LLM_ENABLED: ${FOODMIND_E2E_LLM_ENABLED:-false}
    depends_on:
      inference:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [private]

  cooking:
    build: ../../../foodmind-intelligence/agent-service/app/agents/cooking
    env_file:
      - path: ../../../foodmind-intelligence/agent-service/app/agents/.env
        required: false
    environment:
      COOKING_PLAN_ENVIRONMENT: local
      COOKING_PLAN_INTERNAL_SERVICE_TOKEN: local-cooking-token
      COOKING_PLAN_SAFETY_POLICY_REGION: SG
      COOKING_PLAN_LLM_ENABLED: ${FOODMIND_E2E_LLM_ENABLED:-false}
      COOKING_PLAN_TASK_API_ENABLED: "true"
      COOKING_PLAN_CHECKPOINT_ENABLED: "false"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [private]

  chat:
    build: ../../../foodmind-intelligence/agent-service/app/agents/chatbot
    env_file:
      - path: ../../../foodmind-intelligence/agent-service/app/agents/.env
        required: false
    environment:
      CHAT_AGENT_ENVIRONMENT: local
      CHAT_AGENT_INTERNAL_SERVICE_TOKEN: local-chat-token
      CHAT_AGENT_LLM_ENABLED: ${FOODMIND_E2E_LLM_ENABLED:-false}
      CHAT_AGENT_BACKEND_BASE_URL: http://backend:8080
      CHAT_AGENT_BACKEND_SERVICE_TOKEN: local-backend-tools-token
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [private]

  backend:
    build: ../../../foodmind-backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/foodmind_e2e
      DB_USERNAME: foodmind
      DB_PASSWORD: foodmind_e2e_password
      JWT_SECRET: foodmind-e2e-jwt-secret-longer-than-thirty-two-bytes
      FOODMIND_SECURITY_WEB_COOKIE_SECURE: "false"
      FOODMIND_SECURITY_WEB_ALLOWED_ORIGINS: http://127.0.0.1:4173,http://localhost:4173
      INTERNAL_SERVICE_TOKEN: local-backend-tools-token
      RECOMMENDATION_AGENT_BASE_URL: http://recommendation:8004
      RECOMMENDATION_AGENT_SERVICE_TOKEN: local-recommendation-token
      RECOMMENDATION_AGENT_CONTRACT_VERSION: recommendation-agent-v2
      COOKING_AGENT_BASE_URL: http://cooking:8003
      COOKING_AGENT_SERVICE_TOKEN: local-cooking-token
      COOKING_TASK_POLL_ENABLED: "true"
      COOKING_TASK_POLL_INTERVAL: ${FOODMIND_E2E_COOKING_TASK_POLL_INTERVAL:-5s}
      CHAT_AGENT_BASE_URL: http://chat:8001
      CHAT_AGENT_SERVICE_TOKEN: local-chat-token
      MEDIA_ENABLED: "true"
      MEDIA_S3_BUCKET: foodmind-e2e-media
      MEDIA_S3_REGION: us-east-1
      MEDIA_S3_ENDPOINT: http://minio:9000
      MEDIA_S3_PUBLIC_ENDPOINT: ${FOODMIND_E2E_MEDIA_PUBLIC_ENDPOINT:-http://10.0.2.2:9000}
      MEDIA_S3_ACCESS_KEY: foodmind_e2e_media
      MEDIA_S3_SECRET_KEY: foodmind_e2e_media_password
      MEDIA_UPLOAD_TTL: 5m
      MEDIA_READ_TTL: 15m
      MEDIA_CLEANUP_DELAY: 1m
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      recommendation:
        condition: service_healthy
      cooking:
        condition: service_healthy
      chat:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 20s
    networks: [private]

  web:
    build: ../../../foodmind-web
    ports:
      - "127.0.0.1:4173:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [private]

networks:
  private:

volumes:
  model-package:
  minio-data:
